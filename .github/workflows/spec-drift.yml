name: spec-drift
# Weekly: compare the served public spec with the committed SDK spec. On drift, open or update
# one issue labelled "spec-drift" with a summary. A maintainer then opens the reviewed update PR
# (PRs opened with GITHUB_TOKEN would not trigger CI, so this job only reports).
on:
  schedule:
    - cron: "0 5 * * 1"
  workflow_dispatch:
permissions:
  contents: read
  issues: write
jobs:
  drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {persist-credentials: false}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with: {python-version: "3.12"}
      - run: pip install pyyaml==6.0.2
      - name: Compare and report
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          python tools/drift_report.py > "$RUNNER_TEMP/report.md"
          rc=$?
          set -e
          cat "$RUNNER_TEMP/report.md"
          if [ "$rc" -eq 0 ]; then echo "no drift"; exit 0; fi
          if [ "$rc" -ne 3 ]; then echo "drift report failed"; exit 1; fi
          gh label create spec-drift --color D93F0B --description "Served public spec changed" 2>/dev/null || true
          existing=$(gh issue list --label spec-drift --state open --json number --jq '.[0].number // empty')
          if [ -n "$existing" ]; then
            gh issue edit "$existing" --body-file "$RUNNER_TEMP/report.md"
            gh issue comment "$existing" --body "Still drifting as of $(date -u +%Y-%m-%d); summary updated."
          else
            gh issue create --title "Public spec changed: SDK spec update needed" --label spec-drift --body-file "$RUNNER_TEMP/report.md"
          fi
